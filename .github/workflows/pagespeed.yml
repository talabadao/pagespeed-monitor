name: 📊 PageSpeed Hourly Monitor

on:
  schedule:
    - cron: '0 * * * *'   # Chạy đầu mỗi giờ (UTC)
  workflow_dispatch:        # Cho phép chạy thủ công để test

jobs:
  pagespeed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # Script có retry 3x × 15s delay, đảm bảo đủ thời gian
    permissions:
      contents: write       # Cần quyền push kết quả về repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Cần full history để git push

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PageSpeed check (mobile + desktop)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python pagespeed_checker.py \
            --key "$PSI_API_KEY" \
            --urls-file urls.txt \
            --strategy both

      - name: Dọn raw JSON cũ hơn 7 ngày
        run: |
          find reports/raw -name "*.json" -mtime +7 -delete 2>/dev/null || true

      - name: Commit & push kết quả
        run: |
          git config user.email "pagespeed-bot@github-actions"
          git config user.name "PageSpeed Bot"
          git add "Page Speed Insight/reports/"
          if git diff --staged --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "PSI check $(date -u '+%Y-%m-%d %H:00 UTC')"
            git pull --rebase origin main
            git push
          fi
