name: PageSpeed Hourly Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  pagespeed-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PageSpeed check
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python "Page Speed Insight/pagespeed_checker.py" \
            --key "$PSI_API_KEY" \
            --urls-file "Page Speed Insight/urls.txt" \
            --strategy both

      - name: Xoa raw JSON cu hon 7 ngay
        run: find "Page Speed Insight/reports/raw" -name "*.json" -mtime +7 -delete 2>/dev/null || true

      - name: Commit va push ket qua
        run: |
          git config user.email "pagespeed-bot@github-actions"
          git config user.name "PageSpeed Bot"
          git add "Page Speed Insight/reports/"
          git diff --staged --quiet && echo "No changes" || (git commit -m "PSI check $(date -u '+%Y-%m-%d %H:00 UTC')" && git push)
